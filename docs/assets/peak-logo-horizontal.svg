<rect x="56" y="124" width="44" height="36" rx="11" fill="url(#peakGradient)"/>
<rect x="106" y="124" width="44" height="36" rx="11" fill="url(#peakGradient)"/>
<rect x="156" y="124" width="44" height="36" rx="11" fill="url(#peakGradient)"/>
