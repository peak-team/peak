<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 236" role="img" aria-labelledby="title desc">
<title id="title">PEAK logo mark</title>
<desc id="desc">A stepped performance profile formed by distributed blocks converging toward a peak.</desc>

